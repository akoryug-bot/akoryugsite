  <!-- Elevator outer frame -->
  <rect x="9" y="7" width="14" height="19" rx="2" fill="none" stroke="white" stroke-width="2"/>
  <!-- Upward arrow inside frame -->
  <polygon points="16,9.5 20.5,14.5 18,14.5 18,16 14,16 14,14.5 11.5,14.5" fill="white"/>
  <!-- Left door panel -->
  <rect x="10.5" y="17.5" width="5" height="7" rx="1" fill="white"/>
  <!-- Right door panel -->
  <rect x="16.5" y="17.5" width="5" height="7" rx="1" fill="white"/>
</svg>
